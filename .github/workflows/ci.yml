name: Check web and desktop

on:
  pull_request:
  push:
    branches: [main, 'feature-*', 'release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ssg/package-lock.json
      - name: Cache verified EmulatorJS archive
        uses: actions/cache@v5
        with:
          path: temp/cache/emulatorjs/*.7z
          key: emulatorjs-${{ hashFiles('ssg/licenses/emulatorjs.json') }}
          enableCrossOsArchive: true
      - run: npm ci --ignore-scripts --prefer-offline
      - run: npm --prefix ssg ci --prefer-offline
      - run: npm run test:desktop
      - run: npm run test:prepare
      - run: npm run test:rust-cache
      - run: npm --prefix ssg test
      - run: npm --prefix ssg run build
      - run: npm run desktop:frontend:build
      - name: Install Chromium
        working-directory: ssg
        run: npx playwright install --with-deps chromium
      - name: Verify bundled emulator and desktop frontend
        run: |
          npm --prefix ssg run test:bundled
          npm --prefix ssg run test:desktop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: |
            temp/artifacts/playwright/
            temp/screenshot/
          if-no-files-found: ignore

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2025]
    # Set MACOS_SELF_HOSTED=true to use a runner labelled self-hosted and macOS.
    runs-on: ${{ startsWith(matrix.os, 'macos-') && vars.MACOS_SELF_HOSTED == 'true' && fromJSON('["self-hosted", "macOS"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> ../temp/cache/cargo
          shared-key: desktop-check
          cache-on-failure: true
      - run: cargo fmt --manifest-path app/Cargo.toml --check
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache verified EmulatorJS archive
        uses: actions/cache@v5
        with:
          path: temp/cache/emulatorjs/*.7z
          key: emulatorjs-${{ hashFiles('ssg/licenses/emulatorjs.json') }}
          enableCrossOsArchive: true
      - run: npm ci --ignore-scripts --prefer-offline
      # Tauri also copies bundle resources during debug builds and checks.
      - run: node scripts/prepare-emulatorjs.mjs
      - run: cargo clippy --manifest-path app/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path app/Cargo.toml --locked
