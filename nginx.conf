server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / { try_files $uri $uri/ /index.html; }
    location /emulatorjs/ { try_files $uri =404; expires 7d; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location /licenses/ { charset utf-8; expires -1; try_files $uri =404; }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /player.html { expires -1; }
    location = /player.js { expires -1; }
}
